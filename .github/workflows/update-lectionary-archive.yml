name: Update lectionary archive

on:
  schedule:
    # Sundays at 11:00 UTC (~6am US Central). GitHub's scheduler can run a
    # few minutes late during high load; that's normal. Adjust the hour if
    # you're in a different timezone -- note this doesn't auto-shift for
    # daylight saving.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}
  # ^ lets you trigger a run manually from the Actions tab any time, instead
  #   of waiting for Sunday.

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lectionary_archive/requirements.txt

      - name: Install dependencies
        run: pip install -r lectionary_archive/requirements.txt

      - name: Crawl for new content
        run: python lectionary_archive/scraper.py --delay 1.0

      - name: Export static data for GitHub Pages
        run: python lectionary_archive/export_static.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lectionary_archive/data/lectionary.db docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Automated archive update ($(date +%Y-%m-%d))"
            git push
          fi
